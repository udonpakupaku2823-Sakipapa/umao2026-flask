<script>
function saveAdminComment() {
  const text = document.getElementById("adminComment").value;
  if (!text) {
    alert("コメントを入力してください");
    return;
  }

  db.collection("admin_comments").doc("latest").set({
    text: text,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    alert("コメントを保存しました");
  }).catch(err => {
    console.error("Firestore 書き込みエラー:", err);
    alert("保存に失敗しました");
  });

}
</script>

<script>
  
function runCalc() {
    const raceId = document.getElementById("raceId").value;

    // ★ 画面に「計算中…」を表示（俊裕さんの画面で見える場所）
    document.getElementById("calcStatus").textContent = "計算中…";

    
    fetch(`/calc_points/${raceId}`, { method: "POST" })　　// ★ 2026SUMMER の集計ルートだけを使う
    //fetch(`/calc_points_series/2026_autumn/${raceId}`, { method: "POST" })    // ★ 2026autumn の集計ルートだけを使う
    //fetch(`/calc_points_series/2027_winter/${raceId}`, { method: "POST" })   // ★ 2027winter の集計ルートだけを使う


    .then(res => res.json())
    .then(data => {
        alert(data.message || "SUMMER 集計が完了しました！");
        console.log(data);
    })
    .catch(err => {
        console.error(err);
        alert("SUMMER 集計に失敗しました");
    })
    .finally(() => {
        // ★ 終わったら消す
        document.getElementById("calcStatus").textContent = "";
    });
}



function goMarks() {
    //window.location.href = `/marks_list`;
    window.location.href = `/ranking`;

  }

</script>

<script>
  // ページ読み込み時に最新コメントを取得して textarea にセット
  db.collection("admin_comments")
    .doc("latest")
    .get()
    .then((doc) => {
      if (doc.exists) {
        const data = doc.data();
        document.getElementById("adminComment").value = data.text || "";
      }
    })
    .catch(err => {
      console.error("最新コメント取得エラー:", err);
    });

</script>
