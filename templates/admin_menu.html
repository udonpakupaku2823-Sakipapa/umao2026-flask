<div style="margin-top:10px;">
    <label>① 対象シリーズを選択：</label><br>

    <select id="seriesSelect">
        <option value="autumn">2026 Autumn</option>
    </select>

    <span id="seriesStatus" style="margin-left:8px; color:blue;"></span>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const select = document.getElementById("seriesSelect");
    const status = document.getElementById("seriesStatus");

    // 保存済みシリーズを読み込む
    const saved = localStorage.getItem("series");
    if (saved) {
        select.value = saved;
        status.textContent = `選択中：${saved}`;
    } else {
        status.textContent = "シリーズ未選択";
    }

    // 選択変更時に保存
    select.addEventListener("change", () => {
        const val = select.value;
        localStorage.setItem("series", val);

        status.textContent = `選択中：${val}`;

    });
});
</script>

<script>
function saveAdminComment() {
  const text = document.getElementById("adminComment").value;
  if (!text) {
    alert("コメントを入力してください");
    return;
  }

  db.collection("admin_comments").doc("latest").set({
    text: text,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    alert("コメントを保存しました");
  }).catch(err => {
    console.error("Firestore 書き込みエラー:", err);
    alert("保存に失敗しました");
  });

}
</script>

<script>
  
function runCalc(series) {
    const raceId = document.getElementById("raceId").value;

    document.getElementById("calcStatus").textContent = "計算中…";

    //★シリーズ切替ポイント★
    fetch(`/calc_points_series/2026_autumn/${raceId}?series=${series}`, { method: "POST" })
    .then(res => res.json())
    .then(data => {
        alert(data.message || "AUTUMN 集計が完了しました！");
        console.log(data);
    })
    .catch(err => {
        console.error(err);
        alert("AUTUMN 集計に失敗しました");
    })
    .finally(() => {
        document.getElementById("calcStatus").textContent = "";
    });
}




function goMarks() {
    //window.location.href = `/marks_list`;
    window.location.href = `/ranking`;

  }

</script>

<script>
  // ページ読み込み時に最新コメントを取得して textarea にセット
  db.collection("admin_comments")
    .doc("latest")
    .get()
    .then((doc) => {
      if (doc.exists) {
        const data = doc.data();
        document.getElementById("adminComment").value = data.text || "";
      }
    })
    .catch(err => {
      console.error("最新コメント取得エラー:", err);
    });

</script>
