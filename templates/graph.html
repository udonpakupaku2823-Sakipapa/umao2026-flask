<h1>UMAO 推移グラフ</h1>

<div style="display:flex; gap:12px; margin-bottom:10px;">
  <button class="back-btn" onclick="location.href='/ranking'">← ランキングへ戻る</button>
  <!--<a href="contest_select.html" class="black-gold-btn">コンテストへ戻る</a>-->
</div>

<!--<div style="margin-top: 20px; text-align: center;">
    <a href="history.html" class="black-gold-btn">過去大会を見る</a>
</div>-->

<div style="background-color: #333; padding: 20px; border-radius: 10px;">
    <canvas id="summerChart" style="background-color: #000; height:1000px;"></canvas>
</div>

<!-- Chart.js 本体 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>

<!-- datalabels プラグイン -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<script>
  // ★ Chart.js にプラグインを登録（これが必須）
  Chart.register(ChartDataLabels);
</script>


<script>
fetch("/api/summer_points")
  .then(response => response.json())
  .then(data => {
    const labels = data.labels;
    const pointsData = data.points;

    const datasets = [];
    const userList = [];

    for (const name in pointsData) {
      const rawPoints = pointsData[name];

      const alignedPoints = new Array(labels.length).fill(0);

      // ★ labels の順番に合わせて rawPoints を並べる
      labels.forEach((label, idx) => {
        const found = rawPoints.find(p => p.race === label);
        alignedPoints[idx] = found ? found.point : 0;
      });

      const cumulative = [];
      let sum = 0;
      for (let p of alignedPoints) {
        sum += p;
        cumulative.push(sum);
      }

      userList.push({ name, cumulative });
    }


    userList.sort((a, b) =>
      b.cumulative[b.cumulative.length - 1] -
      a.cumulative[a.cumulative.length - 1]
    );

    // ★ 最大値を計算
    let globalMax = 0;
    userList.forEach(u => {
      const last = u.cumulative[u.cumulative.length - 1];
      if (last > globalMax) globalMax = last;
    });

    userList.forEach(u => {
      datasets.push({
        label: u.name,
        data: u.cumulative,
        borderWidth: 3,
        pointRadius: 4,
        pointHoverRadius: 8,
        tension: 0,
        borderColor: getRandomColor(),
        fill: false
      });
    });

    const ctx = document.getElementById('summerChart');
    new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,   // ← ここに追加！
        layout: {
          padding: {
            left: 30,   // ★ 左端の余白を広げる
            right: 30   // ★ 右端（凡例との距離）も広げる
          }
        },
        plugins: {
          legend: {
            position: 'right',
            labels: {
              color: '#FFD700',   // ★ 金色
              font: { size: 12 },
              padding: 20,   // ★ ここを追加（数値は好みで調整）
              boxWidth: 30,
              usePointStyle: true
            }
          },
          datalabels: {
            color: '#FFD700',     // ★ 金色
            anchor: 'end',
            align: 'top',
            font: { weight: 'bold', size: 16 },
            formatter: (value) => value
          }
        },
        scales: {
          x: {
            ticks: { color: '#FFD700' },   // ★ 金色
            grid: { color: '#444' }        // ★ 黒背景に合う薄いグリッド
          },
          y: {
            ticks: { color: '#FFD700' },   // ★ 金色
            grid: { color: '#444' },
            suggestedMax: globalMax + 10
          }
        }
      }
    });

    function getRandomColor() {
      return `hsl(${Math.random() * 360}, 70%, 50%)`;
    }
  });

</script>




<style>
  body {
    background-color: #444;
  }
  h1 {
    color: #FFD700;
  }
  .back-btn {
    background: #555;              /* 黒金テーマの黒側 */
    color: #fff;
    font-weight: bold;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    box-shadow: 0 0 8px rgba(0,0,0,0.4);
    transition: 0.2s;
  }

  .back-btn:hover {
      background: #666;
      transform: scale(1.05);
  }

  .chart-legend {
    max-height: 300px;     /* スマホで縦に収まる高さ */
    overflow-y: auto;      /* 縦スクロールを許可 */
    padding-right: 10px;   /* スクロールバーと凡例が重ならないように */
  }

</style>
